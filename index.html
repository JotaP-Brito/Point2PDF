<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Point2PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:   #0d0d0d;
      --white:   #f5f0e8;
      --yellow:  #ffe135;
      --green:   #00e676;
      --red:     #ff3d57;
      --card-bg: rgba(15, 15, 15, 0.82);
      --border:  2px solid var(--white);
      --radius:  0px; /* brutalist: no rounding */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--black);
      font-family: 'DM Mono', monospace;
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* ── GIF background ── */
    #gif-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #gif-background img {
      position: absolute;
      pointer-events: none;
      image-rendering: pixelated;
    }

    /* ── Scanline overlay for retro feel ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      border: var(--border);
      backdrop-filter: blur(12px);
      padding: 36px 36px 32px;
      /* brutalist shadow offset */
      box-shadow: 6px 6px 0px var(--yellow);
      animation: slideIn 0.4s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .logo {
      width: 68px;
      height: auto;
      flex-shrink: 0;
      filter: drop-shadow(3px 3px 0 var(--yellow));
    }
    .title-block {}
    .title-block h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--yellow);
      text-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    }
    .title-block p {
      font-size: 0.65rem;
      color: rgba(245,240,232,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Drop zone ── */
    #drop-zone {
      border: 2px dashed rgba(245,240,232,0.3);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: rgba(255,255,255,0.03);
    }
    #drop-zone:hover,
    #drop-zone.dragover {
      border-color: var(--yellow);
      background: rgba(255,225,53,0.05);
    }
    #drop-zone.dragover {
      transform: scale(1.01);
    }
    .drop-icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
      display: block;
      transition: transform 0.2s;
    }
    #drop-zone:hover .drop-icon { transform: scale(1.15) rotate(-4deg); }
    .drop-title {
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--white);
    }
    .drop-sub {
      font-size: 0.68rem;
      color: rgba(245,240,232,0.4);
      margin-top: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #file-name {
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--green);
      min-height: 18px;
      letter-spacing: 1px;
      font-weight: 500;
      word-break: break-all;
    }

    /* ── Output name row ── */
    .output-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 20px;
      border: var(--border);
    }
    .output-row label {
      padding: 10px 14px;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--white);
      color: var(--black);
      white-space: nowrap;
      font-weight: 500;
      flex-shrink: 0;
    }
    .output-row input {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--white);
      outline: none;
      min-width: 0;
    }
    .output-row input:disabled { opacity: 0.3; cursor: not-allowed; }
    .output-row input::placeholder { color: rgba(245,240,232,0.25); }
    .ext-tag {
      padding: 10px 14px;
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: var(--yellow);
      background: rgba(255,225,53,0.08);
      border-left: var(--border);
      flex-shrink: 0;
      font-weight: 500;
    }

    /* ── Convert button ── */
    #convert-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: var(--yellow);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 3px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 4px 4px 0 var(--white);
      position: relative;
    }
    #convert-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--white);
    }
    #convert-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--white);
    }
    #convert-btn:disabled {
      background: rgba(245,240,232,0.15);
      color: rgba(245,240,232,0.3);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── Progress bar ── */
    #progress-bar {
      margin-top: 18px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--yellow), var(--green));
      transition: width 0.25s ease;
      box-shadow: 0 0 8px var(--yellow);
    }

    /* ── Status ── */
    #status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: rgba(245,240,232,0.6);
    }
    #status.success { color: var(--green); }
    #status.error   { color: var(--red); }

    /* ── Action buttons row ── */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .action-btn {
      flex: 1;
      padding: 10px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: var(--border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .action-btn:hover {
      transform: translate(-2px, -2px);
    }
    #open-folder-btn {
      background: var(--white);
      color: var(--black);
      box-shadow: 3px 3px 0 rgba(255,255,255,0.3);
    }
    #open-folder-btn:hover { box-shadow: 5px 5px 0 rgba(255,255,255,0.3); }

    #support-link {
      background: transparent;
      color: var(--green);
      border-color: var(--green);
      box-shadow: 3px 3px 0 var(--green);
    }
    #support-link:hover { box-shadow: 5px 5px 0 var(--green); }

    .hidden { display: none !important; }

    /* ── Supported formats strip ── */
    .formats-strip {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fmt-tag {
      padding: 3px 8px;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(245,240,232,0.55);
    }
    .fmt-tag.native {
      border-color: rgba(0, 230, 118, 0.4);
      color: rgba(0, 230, 118, 0.8);
    }
  </style>
</head>
<body>

  <div id="gif-background"></div>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <img src="Point2PDF.png" alt="Point2PDF" class="logo">
      <div class="title-block">
        <h1>Point2PDF</h1>
        <p>Drop it. Convert it. Done.</p>
      </div>
    </div>

    <!-- Drop zone -->
    <div id="drop-zone">
      <span class="drop-icon">📄</span>
      <div class="drop-title">Drag &amp; Drop your file here</div>
      <div class="drop-sub">or click to browse</div>
      <input type="file" id="file-input" hidden>
    </div>
    <div id="file-name"></div>

    <!-- Output name -->
    <div class="output-row">
      <label for="output-name-input">Save as</label>
      <input type="text" id="output-name-input" placeholder="filename" disabled>
      <span class="ext-tag">.PDF</span>
    </div>

    <!-- Convert -->
    <button id="convert-btn" disabled>⚡ CONVERT TO PDF</button>

    <!-- Progress -->
    <div id="progress-bar" class="hidden">
      <div id="progress-fill"></div>
    </div>

    <!-- Status -->
    <div id="status"></div>

    <!-- Action buttons -->
    <div class="action-row hidden" id="action-row">
      <button class="action-btn" id="open-folder-btn" onclick="openFolder()">📂 Open Folder</button>
      <button class="action-btn" id="support-link" onclick="window.open('https://github.com/JotaP-Brito/Point2PDF','_blank')">★ Star on GitHub</button>
    </div>

    <!-- Format tags -->
    <div class="formats-strip">
      <span class="fmt-tag native">JPG</span>
      <span class="fmt-tag native">PNG</span>
      <span class="fmt-tag native">GIF</span>
      <span class="fmt-tag native">BMP</span>
      <span class="fmt-tag native">TXT</span>
      <span class="fmt-tag native">HTML</span>
      <span class="fmt-tag native">DOCX</span>
      <span class="fmt-tag native">XLSX</span>
      <span class="fmt-tag native">CSV</span>
      <span class="fmt-tag native">ODS</span>
      <span class="fmt-tag">PPTX</span>
      <span class="fmt-tag">DOC</span>
      <span class="fmt-tag">XLS</span>
      <span class="fmt-tag">ODP</span>
    </div>
  </div>

  <script type="text/javascript" src="/eel.js"></script>
  <script>
    // ─── DOM refs ───────────────────────────────────────────────────────────
    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const fileNameDisplay= document.getElementById('file-name');
    const outputNameInput= document.getElementById('output-name-input');
    const convertBtn     = document.getElementById('convert-btn');
    const progressBar    = document.getElementById('progress-bar');
    const progressFill   = document.getElementById('progress-fill');
    const statusDiv      = document.getElementById('status');
    const actionRow      = document.getElementById('action-row');

    let selectedFile = null;

    // ─── Drop zone ──────────────────────────────────────────────────────────
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      selectedFile = file;
      fileNameDisplay.textContent = '→ ' + file.name;
      outputNameInput.value = file.name.replace(/\.[^/.]+$/, "");
      outputNameInput.disabled = false;
      convertBtn.disabled = false;
      setStatus('', '');
      actionRow.classList.add('hidden');
      // Update drop icon based on type
      const ext = file.name.split('.').pop().toLowerCase();
      const icons = { jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🎞️', bmp:'🖼️', txt:'📝', html:'🌐', docx:'📘', xlsx:'📊', csv:'📊', ods:'📊', pdf:'📄', pptx:'📑' };
      dropZone.querySelector('.drop-icon').textContent = icons[ext] || '📄';
    }

    function setStatus(msg, type) {
      statusDiv.textContent = msg;
      statusDiv.className = type || '';
    }

    // ─── Convert ─────────────────────────────────────────────────────────────
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      convertBtn.disabled = true;
      progressBar.classList.remove('hidden');
      progressFill.style.width = '0%';
      setStatus('Converting...', '');

      const reader = new FileReader();
      reader.onload = async function () {
        const b64 = reader.result.split(',')[1];
        try {
          let progress = 0;
          const interval = setInterval(() => {
            progress = Math.min(progress + Math.random() * 18, 88);
            progressFill.style.width = progress + '%';
          }, 280);

          const result = await eel.convert_file(b64, selectedFile.name, outputNameInput.value.trim())();
          clearInterval(interval);

          if (result && result.success) {
            progressFill.style.width = '100%';
            setStatus('✓ ' + result.message, 'success');
            window.lastPdfPath = result.file_path;
            actionRow.classList.remove('hidden');
          } else {
            setStatus('✗ ' + (result ? result.message : 'Unknown error'), 'error');
            progressFill.style.width = '0%';
          }
        } catch (err) {
          setStatus('✗ ' + err.message, 'error');
          progressFill.style.width = '0%';
        } finally {
          convertBtn.disabled = false;
          setTimeout(() => progressBar.classList.add('hidden'), 1200);
        }
      };
      reader.readAsDataURL(selectedFile);
    });

    function openFolder() {
      if (window.lastPdfPath) eel.open_file_explorer(window.lastPdfPath);
    }

    // ─── GIF background ──────────────────────────────────────────────────────
    const MAX_GIFS      = 20;
    const SPAWN_INTERVAL= 1500;
    const MIN_SIZE      = 140;
    const MAX_SIZE      = 220;
    const MIN_SPEED     = 0.3;
    const MAX_SPEED     = 1.1;

    const bgLayer = document.getElementById('gif-background');
    let gifFiles  = [];

    async function loadGifList() {
      try {
        const files = await eel.get_gif_list()();
        if (files && files.length > 0) {
          gifFiles = files;
          setInterval(spawnGif, SPAWN_INTERVAL);
          animate();
        }
      } catch (_) { /* no GIFs — silent */ }
    }

    function spawnGif() {
      if (!gifFiles.length) return;
      const img = document.createElement('img');
      img.src = gifFiles[Math.floor(Math.random() * gifFiles.length)];
      const size = MIN_SIZE + Math.random() * (MAX_SIZE - MIN_SIZE);
      img.style.width  = size + 'px';
      img.style.height = size + 'px';
      img.style.left   = (Math.random() * window.innerWidth)  + 'px';
      img.style.top    = (Math.random() * window.innerHeight) + 'px';
      img.style.opacity= (0.55 + Math.random() * 0.4).toString();
      img._vx = (Math.random() - 0.5) * 2 * (MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED));
      img._vy = (Math.random() - 0.5) * 2 * (MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED));
      bgLayer.appendChild(img);
      while (bgLayer.children.length > MAX_GIFS) bgLayer.removeChild(bgLayer.firstChild);
    }

    function animate() {
      const imgs = bgLayer.querySelectorAll('img');
      const W = window.innerWidth, H = window.innerHeight;
      imgs.forEach(img => {
        let x = parseFloat(img.style.left) + img._vx;
        let y = parseFloat(img.style.top)  + img._vy;
        const w = parseFloat(img.style.width);
        if (x > W)  x = -w;
        if (x < -w) x = W;
        if (y > H)  y = -parseFloat(img.style.height);
        if (y < -parseFloat(img.style.height)) y = H;
        img.style.left = x + 'px';
        img.style.top  = y + 'px';
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('load', loadGifList);
  </script>
</body>
</html>
