<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Point2PDF</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

    background: linear-gradient(
        135deg,
        #f7f9fc 0%,
        #eef3f8 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 650px;

    background: white;

    border-radius: 24px;

    padding: 40px;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.08);

    text-align: center;
}

.logo {
    width: 200px;
    height: auto;
    display: block;
    margin: 0 auto 15px auto;
}

h1 {
    margin: 0;
    font-size: 38px;
    color: #2e7d32;
    font-weight: 700;
}

.subtitle {
    margin-top: 10px;
    margin-bottom: 30px;

    color: #666;
    font-size: 15px;
}

#drop-zone {
    border: 2px dashed #cfcfcf;
    border-radius: 18px;

    background: #fafafa;

    padding: 45px 20px;

    cursor: pointer;

    transition: all 0.25s ease;
}

#drop-zone:hover {
    border-color: #2e7d32;
    background: #f4fbf5;
}

#drop-zone.dragover {
    border-color: #2e7d32;
    background: #e8f5e9;
    transform: scale(1.01);
}

.drop-title {
    font-size: 18px;
    font-weight: 600;
    color: #333;
}

.drop-subtitle {
    margin-top: 8px;
    color: #777;
    font-size: 14px;
}

#file-name {
    margin-top: 15px;
    font-weight: 600;
    color: #2e7d32;
    min-height: 22px;
}

.output-name {
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.output-name label {
    color: #444;
    font-weight: 600;
}

.output-name input {
    width: 280px;

    padding: 12px;

    border-radius: 10px;
    border: 1px solid #d5d5d5;

    font-size: 15px;
}

.output-name input:focus {
    outline: none;
    border-color: #2e7d32;
}

.pdf-label {
    color: #777;
    font-weight: 600;
}

button {
    border: none;
    border-radius: 12px;

    padding: 14px 26px;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;
}

#convert-btn {
    margin-top: 25px;
    width: 100%;

    background: #2e7d32;
    color: white;
}

#convert-btn:hover:not(:disabled) {
    background: #1b5e20;
}

#convert-btn:disabled {
    background: #bdbdbd;
    cursor: not-allowed;
}

#open-folder-btn {
    margin-top: 15px;
    width: 100%;

    background: #1565c0;
    color: white;
}

#open-folder-btn:hover {
    background: #0d47a1;
}

#progress-bar {
    margin-top: 25px;

    width: 100%;
    height: 8px;

    background: #e0e0e0;

    border-radius: 999px;

    overflow: hidden;
}

#progress-fill {
    height: 100%;
    width: 0%;

    background: #2e7d32;

    transition: width 0.25s ease;
}

.hidden {
    display: none;
}

#status {
    margin-top: 15px;

    min-height: 22px;

    font-size: 14px;
    font-weight: 500;
}
</style>

</head>

<body>

<div class="container">


<img src="Point2PDF.png" alt="Point2PDF Logo" class="logo">

<h1>Point2PDF</h1>

<div class="subtitle">
    Free • Fast • Simple Document to PDF Converter
</div>

<div id="drop-zone">
    <div class="drop-title">
        Drag & Drop Your File
    </div>

    <div class="drop-subtitle">
        or click to browse from your computer
    </div>

    <input type="file" id="file-input" hidden>
</div>

<div id="file-name"></div>

<div class="output-name">
    <label for="output-name-input">Save as</label>

    <input
        type="text"
        id="output-name-input"
        placeholder="document"
        disabled>

    <span class="pdf-label">.pdf</span>
</div>

<button id="convert-btn" disabled>
    Convert to PDF
</button>

<div id="progress-bar" class="hidden">
    <div id="progress-fill"></div>
</div>

<div id="status"></div>

<button
    id="open-folder-btn"
    class="hidden"
    onclick="openFolder()">
    📂 Open Output Folder
</button>


</div>

<script type="text/javascript" src="/eel.js"></script>

<script src="app.js"></script>

</body>
</html>
